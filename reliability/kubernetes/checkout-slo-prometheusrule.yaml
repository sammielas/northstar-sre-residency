apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-slo
  namespace: monitoring
  labels:
    release: northstar-monitoring
spec:
  groups:
  - name: sloth-slo-sli-recordings-checkout-checkout-availability-0
    rules:
    - record: slo:sli_error:ratio_rate1m
      expr: "(\n  1 - (\n    (\n      sum(\n  rate(\n    northstar_checkout_attempts_total{\n\
        \      result=\"accepted\"\n    }[1m]\n  )\n)\n\n    )\n    /\n    (\n   \
        \   sum(\n  rate(\n    northstar_checkout_attempts_total[1m]\n  )\n)\n\n \
        \   )\n  )\n)"
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_window: 1m
    - record: slo:sli_error:ratio_rate2m
      expr: "(\n  1 - (\n    (\n      sum(\n  rate(\n    northstar_checkout_attempts_total{\n\
        \      result=\"accepted\"\n    }[2m]\n  )\n)\n\n    )\n    /\n    (\n   \
        \   sum(\n  rate(\n    northstar_checkout_attempts_total[2m]\n  )\n)\n\n \
        \   )\n  )\n)"
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_window: 2m
    - record: slo:sli_error:ratio_rate5m
      expr: "(\n  1 - (\n    (\n      sum(\n  rate(\n    northstar_checkout_attempts_total{\n\
        \      result=\"accepted\"\n    }[5m]\n  )\n)\n\n    )\n    /\n    (\n   \
        \   sum(\n  rate(\n    northstar_checkout_attempts_total[5m]\n  )\n)\n\n \
        \   )\n  )\n)"
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_window: 5m
    - record: slo:sli_error:ratio_rate10m
      expr: "(\n  1 - (\n    (\n      sum(\n  rate(\n    northstar_checkout_attempts_total{\n\
        \      result=\"accepted\"\n    }[10m]\n  )\n)\n\n    )\n    /\n    (\n  \
        \    sum(\n  rate(\n    northstar_checkout_attempts_total[10m]\n  )\n)\n\n\
        \    )\n  )\n)"
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_window: 10m
    - record: slo:sli_error:ratio_rate30m
      expr: "(\n  1 - (\n    (\n      sum(\n  rate(\n    northstar_checkout_attempts_total{\n\
        \      result=\"accepted\"\n    }[30m]\n  )\n)\n\n    )\n    /\n    (\n  \
        \    sum(\n  rate(\n    northstar_checkout_attempts_total[30m]\n  )\n)\n\n\
        \    )\n  )\n)"
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_window: 30m
    - record: slo:sli_error:ratio_rate1h
      expr: "(\n  1 - (\n    (\n      sum(\n  rate(\n    northstar_checkout_attempts_total{\n\
        \      result=\"accepted\"\n    }[1h]\n  )\n)\n\n    )\n    /\n    (\n   \
        \   sum(\n  rate(\n    northstar_checkout_attempts_total[1h]\n  )\n)\n\n \
        \   )\n  )\n)"
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_window: 1h
    - record: slo:sli_error:ratio_rate30d
      expr: 'sum_over_time(slo:sli_error:ratio_rate1m{sloth_id="checkout-checkout-availability-0",
        sloth_service="checkout", sloth_slo="checkout-availability-0"}[30d])

        / ignoring (sloth_window)

        count_over_time(slo:sli_error:ratio_rate1m{sloth_id="checkout-checkout-availability-0",
        sloth_service="checkout", sloth_slo="checkout-availability-0"}[30d])

        '
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_window: 30d
  - name: sloth-slo-meta-recordings-checkout-checkout-availability-0
    rules:
    - record: slo:objective:ratio
      expr: vector(0.9990000000000001)
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
    - record: slo:error_budget:ratio
      expr: vector(1-0.9990000000000001)
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
    - record: slo:time_period:days
      expr: vector(30)
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
    - record: slo:current_burn_rate:ratio
      expr: 'slo:sli_error:ratio_rate1m{sloth_id="checkout-checkout-availability-0",
        sloth_service="checkout", sloth_slo="checkout-availability-0"}

        / on(sloth_id, sloth_slo, sloth_service) group_left

        slo:error_budget:ratio{sloth_id="checkout-checkout-availability-0", sloth_service="checkout",
        sloth_slo="checkout-availability-0"}

        '
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
    - record: slo:period_burn_rate:ratio
      expr: 'slo:sli_error:ratio_rate30d{sloth_id="checkout-checkout-availability-0",
        sloth_service="checkout", sloth_slo="checkout-availability-0"}

        / on(sloth_id, sloth_slo, sloth_service) group_left

        slo:error_budget:ratio{sloth_id="checkout-checkout-availability-0", sloth_service="checkout",
        sloth_slo="checkout-availability-0"}

        '
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
    - record: slo:period_error_budget_remaining:ratio
      expr: 1 - slo:period_burn_rate:ratio{sloth_id="checkout-checkout-availability-0",
        sloth_service="checkout", sloth_slo="checkout-availability-0"}
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_service: checkout
        sloth_slo: checkout-availability-0
    - record: sloth_slo_info
      expr: vector(1)
      labels:
        sloth_id: checkout-checkout-availability-0
        sloth_mode: cli-gen-openslo
        sloth_objective: '99.9'
        sloth_service: checkout
        sloth_slo: checkout-availability-0
        sloth_spec: openslo/v1alpha
        sloth_version: 8a3be4fab79defa4448d09d91b48422615980b05
