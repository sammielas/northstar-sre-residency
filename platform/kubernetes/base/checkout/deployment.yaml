apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: northstar-dev
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: northstar
spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: checkout

  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: northstar
        app.kubernetes.io/version: "0.3.0"

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: checkout
          image: floci-ecr-registry:5000/000000000000/us-east-1/northstar/checkout:0.3.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: checkout-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: checkout-secrets
                  key: DATABASE_URL

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
