apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-sli
  namespace: monitoring
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: northstar-observability
    release: northstar-monitoring
spec:
  groups:
  - name: checkout_sli
    interval: 30s
    rules:
    # --- SLI Recording Rules ---
    - record: sli:checkout:request_rate
      expr: |
        sum(
          rate(
            northstar_checkout_http_requests_total[1m]
          )
        )
    - record: sli:checkout:error_ratio
      expr: |
        sum(
          rate(
            northstar_checkout_http_requests_total{
              status=~"5.."
            }[1m]
          )
        )
        /
        clamp_min(
          sum(
            rate(
              northstar_checkout_http_requests_total[1m]
            )
          ),
          0.000001
        )
    - record: sli:checkout:p50
      expr: |
        histogram_quantile(
          0.50,
          sum by (le)(
            rate(
              northstar_checkout_http_request_duration_seconds_bucket[1m]
            )
          )
        )
    - record: sli:checkout:p95
      expr: |
        histogram_quantile(
          0.95,
          sum by (le)(
            rate(
              northstar_checkout_http_request_duration_seconds_bucket[1m]
            )
          )
        )
    - record: sli:checkout:p99
      expr: |
        histogram_quantile(
          0.99,
          sum by (le)(
            rate(
              northstar_checkout_http_request_duration_seconds_bucket[1m]
            )
          )
        )
    - record: sli:checkout:dependency
      expr: |
        min(
          northstar_checkout_dependency_up
        )

    # --- Good Requests Ratio (Requests <= 250ms over 1m) ---
    - record: sli:checkout:latency_good_ratio_1m
      expr: |
        sum(
          rate(
            northstar_checkout_http_request_duration_seconds_bucket{
              le="0.25"
            }[1m]
          )
        )
        /
        clamp_min(
          sum(
            rate(
              northstar_checkout_http_request_duration_seconds_count[1m]
            )
          ),
          0.000001
        )

    # --- SLO Targets (in seconds) ---
    - record: slo:checkout:latency_target_p50_seconds
      expr: vector(0.100)

    - record: slo:checkout:latency_target_p95_seconds
      expr: vector(0.250)

    - record: slo:checkout:latency_target_p99_seconds
      expr: vector(0.500)

    # --- SLO Compliance Rules (1 = Meeting SLO, 0 = SLO Breached) ---
    - record: slo:checkout:p50_compliant
      expr: |
        sli:checkout:p50 < bool 0.100

    - record: slo:checkout:p95_compliant
      expr: |
        sli:checkout:p95 < bool 0.250

    - record: slo:checkout:p99_compliant
      expr: |
        sli:checkout:p99 < bool 0.500