apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inc-004b-jvm-cache
  namespace: monitoring
  labels:
    release: northstar-monitoring
spec:
  groups:
  - name: inc-004b
    rules:
    - alert: JVMHeapUsageHigh
      expr: (sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"})) > 0.75
      for: 2m
      labels:
        severity: warning
        service: jvm-cache-demo
      annotations:
        summary: "JVM heap usage is high"
        description: "Heap pressure is increasing and customer latency may be affected."
        runbook_url: "https://github.com/<YOUR-USER>/<YOUR-REPO>/blob/main/runbooks/applications/jvm-memory-pressure.md"
        dashboard_url: "http://127.0.0.1:3000/d/adcc7f4/inc-004b-e28094-jvm-cache-leak?orgId=1&from=now-6h&to=now&timezone=browser"

    - alert: JVMProfileHighP95Latency
      expr: northstar_profile_p95_seconds > 0.25
      for: 1m
      labels:
        severity: warning
        service: jvm-cache-demo
      annotations:
        summary: "Profile API P95 latency is high"
        description: "Profile response times have crossed 250ms due to GC pauses or high queue depth."
        runbook_url: "https://github.com/sammielas/northstar-sre-residency/blob/main/runbooks/applications/jvm-memory-pressure.md"
        dashboard_url: "http://127.0.0.1:3000/d/adcc7f4/inc-004b-e28094-jvm-cache-leak?orgId=1&from=now-6h&to=now&timezone=browser"