apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvm-cache-demo
  namespace: northstar-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jvm-cache-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jvm-cache-demo
    spec:
      containers:
      - name: app
        image: floci-ecr-registry:5000/000000000000/us-east-1/northstar/jvm-cache-demo:0.1.0
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: 500m, memory: 384Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          timeoutSeconds: 1
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          timeoutSeconds: 3
          periodSeconds: 15
          failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jvm-cache-demo
  namespace: northstar-dev
  labels:
    app.kubernetes.io/name: jvm-cache-demo
spec:
  selector:
    app.kubernetes.io/name: jvm-cache-demo
  ports:
  - name: http
    port: 8080
    targetPort: http